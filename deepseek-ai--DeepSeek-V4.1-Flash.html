<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:22px;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 18%,#2c3d4e 0%,#141d26 62%,#0b1116 100%);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  .card{
    width:min(1220px,100%);
    padding:14px 14px 6px;
    border-radius:22px;
    background:linear-gradient(180deg,#16212b,#0d151c);
    box-shadow:0 34px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07) inset;
  }
  svg{display:block;width:100%;height:auto;border-radius:14px;background:#bfe6f7}
  .cap{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:12px 8px 8px;font-size:12px;letter-spacing:.14em;color:#7f97a9;
  }
  .cap b{font-size:14px;font-weight:600;letter-spacing:.22em;color:#e6f0f7}
</style>
</head>
