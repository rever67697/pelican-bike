<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  html,body{margin:0;padding:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
       background:linear-gradient(180deg,#141d29,#0b1017);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#e8eef5}
  h1{font-size:22px;font-weight:600;margin:0;letter-spacing:2px}
  .sub{margin:0;font-size:12px;color:#8fa3b8;letter-spacing:1px}
  .stage{width:min(92vw,880px)}
  .stage svg{display:block;width:100%;height:auto;border-radius:16px;background:none;
             box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
  /* 云层整体左移，800px 后与自身副本无缝衔接 */
  .clouds{animation:drift 26s linear infinite}
  @keyframes drift{to{transform:translateX(-800px)}}
  /* 前景灌木以 300px 为周期快速掠过 */
  .bushes{animation:bushrun 2.2s linear infinite}
  @keyframes bushrun{to{transform:translateX(-300px)}}
  /* 速度线 */
  .sp{stroke:#9db4c9;stroke-width:5;stroke-linecap:round;fill:none;animation:zoom 1s linear infinite}
  .sp2{animation-delay:.33s}
  .sp3{animation-delay:.66s}
  @keyframes zoom{0%{transform:translateX(40px);opacity:0}15%{opacity:.9}100%{transform:translateX(-110px);opacity:0}}
</style>
</head>
<body>
<h1>鹈鹕骑自行车</h1>
<p class="sub">纯 SVG + SMIL / CSS 动画 · 单文件 · 无依赖</p>
<div class="stage">
<svg viewBox="0 0 800 500" role="img" aria-label="一只鹈鹕骑着自行车的二维动画">
  <title>鹈鹕骑自行车</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed0f0"/>
      <stop offset="1" stop-color="#eaf7ec"/>
    </linearGradient>
    <g id="cl" fill="#ffffff" opacity=".95">
      <ellipse cx="0" cy="0" rx="42" ry="15"/>
      <circle cx="-18" cy="-8" r="15"/>
      <circle cx="12" cy="-13" r="19"/>
    </g>
    <g id="bush" fill="#4f9e57">
      <circle cx="-14" cy="444" r="13"/>
      <circle cx="12" cy="441" r="15"/>
      <circle cx="0" cy="450" r="16"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="452" fill="url(#sky)"/>

  <!-- 太阳：光晕圈用虚线描边模拟光芒，缓慢旋转 -->
  <g>
    <circle cx="700" cy="80" r="40" fill="none" stroke="#ffd75e" stroke-width="10" stroke-dasharray="3 15" opacity=".9">
      <animateTransform attributeName="transform" type="rotate" values="0 700 80;360 700 80" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="80" r="26" fill="#ffdf6b">
      <animate attributeName="r" values="26;28.5;26" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云（漂移，含 800px 处的副本用于无缝循环） -->
  <g class="clouds">
    <use href="#cl" x="130" y="95"/>
    <use href="#cl" x="430" y="140" transform="scale(1)" />
    <use href="#cl" x="930" y="95"/>
    <use href="#cl" x="1230" y="140"/>
  </g>

  <!-- 远山与草地 -->
  <path d="M0 452 L0 404 Q120 362 240 404 Q340 434 440 398 Q570 356 700 402 Q760 422 800 406 L800 452 Z" fill="#a9d8a4"/>
  <path d="M0 452 L0 428 Q160 402 320 430 Q480 452 640 424 Q740 408 800 424 L800 452 Z" fill="#8cc889"/>
  <rect x="0" y="430" width="800" height="24" fill="#7cbd6e"/>

  <!-- 路面 -->
  <rect x="0" y="452" width="800" height="44" fill="#5a6473"/>
  <rect x="0" y="496" width="800" height="4" fill="#cfd6dd"/>
  <line x1="-40" y1="478" x2="840" y2="478" stroke="#f5d76e" stroke-width="6" stroke-dasharray="42 30">
    <animate attributeName="stroke-dashoffset" from="0" to="72" dur="0.7s" repeatCount="indefinite"/>
  </line>

  <!-- 地面投影 -->
  <ellipse cx="400" cy="462" rx="152" ry="8" fill="#000" opacity=".18">
    <animate attributeName="rx" values="152;161;152" dur="0.7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ======== 自行车 + 鹈鹕（整体轻微上下颠动） ======== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2.5;0 0" dur="0.7s" repeatCount="indefinite"/>

    <!-- 后轮 -->
    <circle cx="280" cy="400" r="55" fill="none" stroke="#2c3e50" stroke-width="7"/>
    <circle cx="280" cy="400" r="47" fill="none" stroke="#a7b0ba" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 280 400;360 280 400" dur="1s" repeatCount="indefinite"/>
      <line x1="233" y1="400" x2="327" y2="400" stroke="#c8d0d8" stroke-width="2.5"/>
      <line x1="233" y1="400" x2="327" y2="400" stroke="#c8d0d8" stroke-width="2.5" transform="rotate(60 280 400)"/>
      <line x1="233" y1="400" x2="327" y2="400" stroke="#c8d0d8" stroke-width="2.5" transform="rotate(120 280 400)"/>
      <circle cx="280" cy="400" r="55" fill="none" stroke="#2c3e50" stroke-width="7" stroke-dasharray="10 8" opacity=".35"/>
      <circle cx="280" cy="400" r="10" fill="none" stroke="#8892a0" stroke-width="4" stroke-dasharray="3 4"/>
    </g>
    <circle cx="280" cy="400" r="6" fill="#2c3e50"/>

    <!-- 前轮 -->
    <circle cx="520" cy="400" r="55" fill="none" stroke="#2c3e50" stroke-width="7"/>
    <circle cx="520" cy="400" r="47" fill="none" stroke="#a7b0ba" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 520 400;360 520 400" dur="1s" begin="-0.45s" repeatCount="indefinite"/>
      <line x1="473" y1="400" x2="567" y2="400" stroke="#c8d0d8" stroke-width="2.5"/>
      <line x1="473" y1="400" x2="567" y2="400" stroke="#c8d0d8" stroke-width="2.5" transform="rotate(60 520 400)"/>
      <line x1="473" y1="400" x2="567" y2="400" stroke="#c8d0d8" stroke-width="2.5" transform="rotate(120 520 400)"/>
      <circle cx="520" cy="400" r="55" fill="none" stroke="#2c3e50" stroke-width="7" stroke-dasharray="10 8" opacity=".35"/>
    </g>
    <circle cx="520" cy="400" r="6" fill="#2c3e50"/>

    <!-- 车架 -->
    <path d="M280 400 L380 405 M280 400 L334 308 M334 308 L380 405 M334 308 L480 306 M380 405 L480 306 M480 306 L520 400 M334 308 L330 301 M480 306 L486 289"
          fill="none" stroke="#d64545" stroke-width="7" stroke-linecap="round"/>
    <!-- 弯把 -->
    <path d="M486 289 q18 -2 20 12 q1 9 -9 11" fill="none" stroke="#2c3e50" stroke-width="5" stroke-linecap="round"/>
    <!-- 车座 -->
    <ellipse cx="326" cy="300" rx="21" ry="7" fill="#2c3e50" transform="rotate(-6 326 300)"/>

    <!-- 链条（虚线流动）与齿盘 -->
    <path d="M366 386 L270 391 L270 409 L366 424 Z" fill="none" stroke="#6b7280" stroke-width="4" stroke-dasharray="5 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.5s" repeatCount="indefinite"/>
    </path>

    <!-- 远侧腿（身体后方，相位差 180°） -->
    <path d="M372 286 Q368 352 354 405" fill="none" stroke="#c0691c" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;.25;.5;.75;1"
        values="M372 286 Q368 352 354 405;
                M372 286 Q365 338 380 379;
                M372 286 Q395 345 406 405;
                M372 286 Q392 360 380 431;
                M372 286 Q368 352 354 405"/>
    </path>

    <!-- ======== 鹈鹕 ======== -->
    <g>
      <!-- 身体随踩踏轻轻起伏 -->
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1s" repeatCount="indefinite"/>

      <!-- 尾羽 -->
      <path d="M309 244 L270 224 L287 249 L266 250 L301 268 Z" fill="#f2ecdf" stroke="#d5cfc0" stroke-width="1.5"/>
      <!-- 躯干 -->
      <ellipse cx="358" cy="258" rx="58" ry="40" fill="#fffdf7" stroke="#d8d2c4" stroke-width="1.5" transform="rotate(-6 358 258)"/>

      <!-- 脖颈 + 头（缓慢点动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-2 443 193;3 443 193;-2 443 193" dur="2s" repeatCount="indefinite"/>
        <path d="M399 233 C404 214 424 198 443 192" fill="none" stroke="#fffdf7" stroke-width="21" stroke-linecap="round"/>
        <!-- 喉囊 -->
        <path d="M472 184 C505 206 532 203 556 187 C522 216 492 210 468 190 Z" fill="#e67e22"/>
        <!-- 上喙 -->
        <path d="M472 172 L560 181 Q565 183 560 186 L472 185 Z" fill="#f39c12" stroke="#d97f0a" stroke-width="1"/>
        <!-- 头 -->
        <circle cx="455" cy="180" r="20" fill="#fffdf7" stroke="#d8d2c4" stroke-width="1.5"/>
        <!-- 眼睛 -->
        <circle cx="462" cy="176" r="3.2" fill="#22252a"/>
        <circle cx="463.2" cy="174.8" r="1" fill="#fff"/>
        <!-- 骑行小帽 -->
        <path d="M437 172 A19 17 0 0 1 474 172 Z" fill="#2e86de"/>
        <path d="M470 168 Q492 161 499 169 L471 176 Z" fill="#2e86de"/>
        <circle cx="455" cy="156" r="2.5" fill="#1c5fa8"/>
      </g>

      <!-- 翅膀（扇动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-16 384 244;12 384 244;-16 384 244" dur="1.4s" repeatCount="indefinite"/>
        <path d="M331 252 C352 228 398 231 410 255 C388 273 348 275 331 252 Z" fill="#f2ecdf" stroke="#d5cfc0" stroke-width="1.5"/>
        <path d="M347 261 Q357 267 369 263 M370 265 Q381 271 393 264" fill="none" stroke="#cfc7b5" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 近侧腿（身体前方） -->
    <path d="M372 286 Q395 345 406 405" fill="none" stroke="#e67e22" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;.25;.5;.75;1"
        values="M372 286 Q395 345 406 405;
                M372 286 Q392 360 380 431;
                M372 286 Q368 352 354 405;
                M372 286 Q365 338 380 379;
                M372 286 Q395 345 406 405"/>
    </path>

    <!-- 曲柄 + 脚踏 + 牙盘（整体旋转，与腿部动画同周期同相位） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 380 405;360 380 405" dur="2s" repeatCount="indefinite"/>
      <circle cx="380" cy="405" r="20" fill="none" stroke="#8a94a2" stroke-width="6" stroke-dasharray="4 5"/>
      <line x1="380" y1="405" x2="406" y2="405" stroke="#2c3e50" stroke-width="5" stroke-linecap="round"/>
      <line x1="380" y1="405" x2="354" y2="405" stroke="#2c3e50" stroke-width="5" stroke-linecap="round"/>
      <rect x="394" y="400" width="26" height="9" rx="4" fill="#34495e"/>
      <rect x="340" y="400" width="26" height="9" rx="4" fill="#34495e"/>
    </g>
    <circle cx="380" cy="405" r="5" fill="#2c3e50"/>
  </g>

  <!-- 速度线 -->
  <g>
    <path class="sp"     d="M238 258 h-46"/>
    <path class="sp sp2" d="M252 300 h-58"/>
    <path class="sp sp3" d="M244 340 h-40"/>
  </g>

  <!-- 前景灌木（300px 间隔 + 副本，快速左移制造前进感） -->
  <g class="bushes">
    <use href="#bush" x="60"/>
    <use href="#bush" x="360"/>
    <use href="#bush" x="660"/>
    <use href="#bush" x="960"/>
  </g>
</svg>
</div>
</body>
</html>
